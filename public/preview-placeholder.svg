<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">No social preview image</title>
  <desc id="description">A soft violet placeholder with the MetaScope mark.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1efff"/>
      <stop offset="1" stop-color="#e8f6f5"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7562f3"/>
      <stop offset="1" stop-color="#4f3cce"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="190" cy="105" r="210" fill="#ffffff" opacity=".28"/>
  <circle cx="1080" cy="580" r="250" fill="#ffffff" opacity=".25"/>
  <g transform="translate(506 170)">
    <rect width="188" height="188" rx="52" fill="url(#mark)"/>
    <rect x="48" y="52" width="70" height="52" rx="12" fill="none" stroke="#fff" stroke-width="13"/>
    <rect x="70" y="82" width="70" height="52" rx="12" fill="none" stroke="#fff" stroke-width="13"/>
  </g>
  <text x="600" y="420" fill="#28243e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="38" font-weight="700" text-anchor="middle">No social image found</text>
  <text x="600" y="468" fill="#716d84" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" text-anchor="middle">Add an og:image tag to shape your link preview.</text>
</svg>
